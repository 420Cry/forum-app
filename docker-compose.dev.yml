services:
  app:
    container_name: forum-app
    # Distinct from docker-compose.yml (forum-app:prod) so `forum up` cannot
    # overwrite this image with USER nuxt / node-only runtime.
    image: forum-app:dev
    user: "0:0"
    env_file:
      - .env
      - .env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: ${PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
    # Keep named /app/node_modules in sync with package.json on start.
    command: sh -c "bun install && bun run dev"
    networks:
      - forum.test

volumes:
  app_node_modules:

networks:
  forum.test:
    name: forum.test
    external: true
