name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep in-flight main runs; cancel superseded PR/feature runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.2.22"

jobs:
  # Always runs on every push/PR (including Dependabot): lint, unit tests, production build.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install forum-app dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

      - name: Unit coverage summary
        if: always()
        run: |
          if [[ -f coverage/coverage-summary.json ]]; then
            node .github/scripts/unit-coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment CI report on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Early coverage-only comment; the e2e job replaces this with the full report
          # when full-stack e2e runs. Dependency-bot PRs keep this comment as the final report.
          node .github/scripts/unit-coverage-summary.mjs \
            coverage/coverage-summary.json --collapse > ci-comment.md
          if [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "renovate[bot]" ]]; then
            {
              echo
              echo "---"
              echo
              echo "### E2E"
              echo "Skipped for dependency-update PRs (no sibling checkouts, no Playwright)."
            } >> ci-comment.md
          fi
          bash .github/scripts/pr-sticky-comment.sh \
            '<!-- ci-report -->' ci-comment.md '${{ github.event.pull_request.number }}'

      - name: Build
        run: bun run build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: forum-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Decide in bash so YAML never sees unquoted [bot] (that invalidates the whole workflow).
      - name: Decide whether to run full e2e
        id: scope
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          full=true
          if [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "renovate[bot]" ]]; then
            full=false
          elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$THIS_REPO" ]]; then
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [[ "$full" != true ]]; then
            {
              echo "### E2E skipped"
              echo
              echo "Dependency-update and fork PRs run **verify** (lint, unit tests, build)"
              echo "and **docker** only. Sibling checkouts and Playwright are reserved for"
              echo "human PRs in this repo and pushes to main."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout forum-app (PR branch)
        if: steps.scope.outputs.full == 'true'
        uses: actions/checkout@v4
        with:
          path: forum-app
          persist-credentials: false

      - name: Require FORUM_CI_PAT
        if: steps.scope.outputs.full == 'true'
        env:
          FORUM_CI_PAT: ${{ secrets.FORUM_CI_PAT }}
        run: |
          if [[ -z "${FORUM_CI_PAT}" ]]; then
            echo "::error::Secret FORUM_CI_PAT is required to checkout private 420Cry/forum-server. Add a PAT with contents:read on forum-api, forum-test-automation, and forum-server."
            exit 1
          fi

      - name: Resolve sibling branch refs
        if: steps.scope.outputs.full == 'true'
        id: refs
        env:
          GH_TOKEN: ${{ secrets.FORUM_CI_PAT }}
          # PR source branch, or the pushed branch name on push events.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          resolve() {
            bash forum-app/.github/scripts/resolve-sibling-ref.sh "$1" "$BRANCH" main
          }
          API_REF="$(resolve 420Cry/forum-api)"
          E2E_REF="$(resolve 420Cry/forum-test-automation)"
          SERVER_REF="$(resolve 420Cry/forum-server)"
          {
            echo "api=${API_REF}"
            echo "e2e=${E2E_REF}"
            echo "server=${SERVER_REF}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### E2E sibling refs"
            echo "- app branch: \`${BRANCH}\`"
            echo "- forum-api: \`${API_REF}\`"
            echo "- forum-test-automation: \`${E2E_REF}\`"
            echo "- forum-server: \`${SERVER_REF}\`"
            echo
            echo "Matching branch name is used when it exists in the sibling repo; otherwise \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout forum-api
        if: steps.scope.outputs.full == 'true'
        uses: actions/checkout@v4
        with:
          repository: 420Cry/forum-api
          ref: ${{ steps.refs.outputs.api }}
          path: forum-api
          token: ${{ secrets.FORUM_CI_PAT }}
          persist-credentials: false

      - name: Checkout forum-test-automation
        if: steps.scope.outputs.full == 'true'
        uses: actions/checkout@v4
        with:
          repository: 420Cry/forum-test-automation
          ref: ${{ steps.refs.outputs.e2e }}
          path: forum-test-automation
          token: ${{ secrets.FORUM_CI_PAT }}
          persist-credentials: false

      - name: Checkout forum-server
        if: steps.scope.outputs.full == 'true'
        uses: actions/checkout@v4
        with:
          repository: 420Cry/forum-server
          ref: ${{ steps.refs.outputs.server }}
          path: forum-server
          token: ${{ secrets.FORUM_CI_PAT }}
          persist-credentials: false

      - name: Setup Bun
        if: steps.scope.outputs.full == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Supabase CLI
        if: steps.scope.outputs.full == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install forum-api dependencies
        if: steps.scope.outputs.full == 'true'
        run: bun install --frozen-lockfile
        working-directory: forum-api

      # forum-app deps install inside the dev container (named volume). A host
      # install here is unused — Playwright runs from forum-test-automation.

      - name: Install e2e dependencies
        if: steps.scope.outputs.full == 'true'
        run: bun install --frozen-lockfile
        working-directory: forum-test-automation

      - name: Install Playwright Chromium
        if: steps.scope.outputs.full == 'true'
        run: bunx playwright install chromium --with-deps
        working-directory: forum-test-automation

      - name: Run e2e stack and tests
        if: steps.scope.outputs.full == 'true'
        env:
          FORUM_PROJECTS_ROOT: ${{ github.workspace }}
          CI: "true"
        run: bash forum-app/.github/scripts/ci-e2e.sh

      - name: E2E summary
        if: always() && steps.scope.outputs.full == 'true'
        run: |
          RESULTS="forum-test-automation/playwright-report/results.json"
          node forum-app/.github/scripts/report-e2e-summary.mjs "$RESULTS" >> "$GITHUB_STEP_SUMMARY"

      - name: Download unit coverage
        if: always() && steps.scope.outputs.full == 'true' && github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: unit-coverage
        continue-on-error: true

      - name: Comment CI report on PR
        if: always() && steps.scope.outputs.full == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RESULTS="forum-test-automation/playwright-report/results.json"
          {
            if [[ -f unit-coverage/coverage-summary.json ]]; then
              node forum-app/.github/scripts/unit-coverage-summary.mjs \
                unit-coverage/coverage-summary.json --collapse
              echo
              echo "---"
              echo
            fi
            E2E_RUN_URL="$RUN_URL" node forum-app/.github/scripts/report-e2e-summary.mjs \
              "$RESULTS" --collapse
          } > ci-comment.md
          bash forum-app/.github/scripts/pr-sticky-comment.sh \
            '<!-- ci-report -->' ci-comment.md '${{ github.event.pull_request.number }}'

      - name: Upload Playwright report
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: forum-test-automation/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: forum-test-automation/test-results/
          retention-days: 7
